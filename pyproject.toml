[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgenmap"
version = "0.1.0"
description = "Cross-platform GUI for Nmap with SearchSploit integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml>=5.3.0",
  "python-crontab>=2.7.1",
  "python-nmap>=0.7.1",
  "PyQt6>=6.6.0",
]

[tool.setuptools]
package-dir = {"" = "src", "res" = "res"}
packages = ["nextgenmap", "res"]
include-package-data = true

[tool.setuptools.package-data]
res = ["*.xsl"]
